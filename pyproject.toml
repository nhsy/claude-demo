[project]
name = "vault-posture-skill"
version = "0.2.0"
description = "Read-only HashiCorp Vault security posture Claude skill and its local dev environment"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "hvac==2.4.0",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]

[tool.uv]
package = false
exclude-newer = "2026-10-05T00:00:00Z"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/vault-posture/scripts"]
markers = [
  "integration: needs a running, seeded dev Vault and a vault-posture-readonly token (task up && task seed && task token)",
]
addopts = "-m 'not integration'"
