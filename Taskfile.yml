version: "3"

# Every workflow in this repo runs through Task: dev servers, seeding, tokens, the skill
# script, policies, lint, tests and evals. CI calls the same tasks. `task` lists them.

dotenv: [".env"]

vars:
  SKILL_SCRIPT: skills/vault-posture/scripts/vault_posture.py

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: One-time setup (python deps, pre-commit hooks, .env from template)
    cmds:
      - test -f .env || cp .env.template .env
      - uv sync
      - uv run pre-commit install

  # ---- dev servers: local `vault server -dev` (default) or containers

  dev:up:
    desc: Start a local `vault server -dev` on 127.0.0.1:${VAULT_DEV_PORT} (default 8250; no containers needed)
    cmds:
      - scripts/dev_up.sh

  dev:down:
    desc: Stop the local `vault server -dev` (in memory, so all state goes with it)
    cmds:
      - scripts/dev_down.sh

  dev:logs:
    desc: Tail the local dev server log
    cmds:
      - tail -f .tmp/vault-dev/vault.log

  up:
    desc: Start the Community dev server container on 127.0.0.1:${VAULT_CE_PORT} (default 8250)
    cmds:
      - ${CONTAINER_CLI:-docker} compose up -d --wait vault

  up:ent:
    desc: Start the Enterprise dev server container on 127.0.0.1:${VAULT_ENT_PORT} (default 8260; needs VAULT_LICENSE)
    preconditions:
      - sh: test -n "${VAULT_LICENSE:-}"
        msg: "VAULT_LICENSE is empty in .env"
    cmds:
      - ${CONTAINER_CLI:-docker} compose --profile ent up -d --wait vault-ent

  down:
    desc: Stop and remove the dev server containers
    cmds:
      - ${CONTAINER_CLI:-docker} compose --profile '*' down

  logs:
    desc: "Tail a container's log (SERVICE=vault-ent task logs for Enterprise)"
    cmds:
      - ${CONTAINER_CLI:-docker} compose logs -f --tail 50 {{.SERVICE | default "vault"}}

  # ---- dev server contents

  seed:
    desc: Seed config that trips every live-testable VP rule (dev root token)
    cmds:
      - scripts/seed_findings.sh

  token:
    desc: Write the read-only policies and mint a 1h token (base + PKI add-on) to .tmp/posture-token
    cmds:
      - scripts/posture_token.sh

  token:base:
    desc: Like token, but without the PKI add-on (PKI coverage is reported as denied)
    cmds:
      - PKI_READER=0 scripts/posture_token.sh

  # ---- the skill

  skill:run:
    desc: "Run the skill script with the read-only token: task skill:run -- <audit|quotas|security|roles|pki>"
    cmds:
      - VAULT_ADDR="${VAULT_ADDR:-http://127.0.0.1:8250}" VAULT_TOKEN="$(cat .tmp/posture-token)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/posture-token
        msg: "No read-only token; run: task token"

  skill:access:
    desc: "Offline policy evaluation, no Vault: task skill:access -- --policy <dir|file> --path <path> [--capability update]"
    cmds:
      - uv run --script {{.SKILL_SCRIPT}} access {{.CLI_ARGS | default "--help"}}

  policies:
    desc: Regenerate the read-only policy files from scripts/gen_policies.py
    cmds:
      - uv run python scripts/gen_policies.py

  # ---- quality gates

  lint:
    desc: Run all pre-commit hooks (ruff, shellcheck, gitleaks, yaml/json)
    cmds:
      # --files covers untracked files too (--all-files only sees tracked ones)
      - git ls-files -co --exclude-standard -z | xargs -0 uv run pre-commit run --files

  test:
    desc: Unit tests (no Vault needed), coverage >= 90%
    cmds:
      - uv run pytest -q --cov=vault_posture --cov-report=term-missing --cov-fail-under=90

  test:integration:
    desc: Integration tests against the seeded dev server with the read-only token
    cmds:
      - VAULT_ADDR="${VAULT_ADDR:-http://127.0.0.1:8250}" VAULT_TOKEN="$(cat .tmp/posture-token)" uv run pytest -q -m integration
    preconditions:
      - sh: test -s .tmp/posture-token
        msg: "No read-only token; run: task dev:up seed token"

  test:e2e:
    desc: "Fresh local `vault server -dev` -> seed -> token -> unit + integration tests -> stop"
    cmds:
      - scripts/e2e.sh

  test:e2e:compose:
    desc: "Like test:e2e, on a fresh container (ENT=1 for the Enterprise one)"
    cmds:
      - MODE=compose scripts/e2e.sh

  test:ci:
    desc: CI pipeline (lint + plugin manifests + unit tests with coverage)
    cmds:
      - task: lint
      - task: plugin:validate
      - task: test

  github:setup:
    desc: "One-time repo setup for the /issue-sdlc pipeline: create the agent-* labels, check merge settings (needs gh with write access)"
    # REST only (gh api), so it also works where GitHub GraphQL is blocked, as in Claude Code
    # cloud sessions. gh api fills {owner}/{repo} in from the git remote.
    preconditions:
      - sh: gh api repos/{owner}/{repo} --silent
        msg: "gh can't reach this repo's API; run: gh auth login"
    cmds:
      # Each label is created, or updated in place when it already exists, so reruns reset
      # colour and description. Colours run from go (green) through the stages to stopped
      # (red), then grey once done; people set the green and purple ones.
      - |
        label() {
          gh api -X POST repos/{owner}/{repo}/labels -f name="$1" -f color="$2" -f description="$3" --silent 2>/dev/null \
            || gh api -X PATCH "repos/{owner}/{repo}/labels/$1" -f color="$2" -f description="$3" --silent
          echo "label $1"
        }
        label agent-ready 0E8A16 "Meets the definition of ready; /issue-sdlc will plan it (set by a person)"
        label agent-working FBCA04 "A Claude Code session holds this issue; other runs skip it"
        label agent-plan-review 1D76DB "Implementation plan posted; waiting for a person to approve"
        label agent-build 5319E7 "Plan approved; /issue-sdlc will build it (set by a person)"
        label agent-pr-review 006B75 "Draft PR open; waiting for a person to review it"
        label agent-fix 5319E7 "On an agent PR: feedback left; /issue-sdlc will address it (set by a person)"
        label agent-blocked B60205 "Claude asked a question or a run stopped; needs a person"
        label agent-done 6E7781 "PR merged and issue closed; delivered through the agent pipeline"
      # Merge settings are only checked, never written: changing them is the repo admin's call.
      # Any drift is listed with where to fix it; the task still succeeds.
      - |
        drift="$(gh api repos/{owner}/{repo} --jq '
          [ (if .allow_rebase_merge != true then "  - Allow rebase merging: turn ON" else empty end),
            (if .allow_squash_merge != false then "  - Allow squash merging: turn OFF" else empty end),
            (if .allow_merge_commit != false then "  - Allow merge commits: turn OFF" else empty end),
            (if .delete_branch_on_merge != true then "  - Automatically delete head branches: turn ON" else empty end)
          ] | join("\n")')"
        if [ -z "$drift" ]; then
          echo "repo settings OK: rebase merging only, branch auto-delete on"
        else
          echo "WARNING: repo merge settings differ from what the /issue-sdlc pipeline expects."
          echo "Change them in GitHub: Settings > General > Pull Requests"
          echo "$drift"
        fi

  plugin:validate:
    desc: Validate the plugin and marketplace manifests
    cmds:
      # Not --strict: the repo's own CLAUDE.md at the plugin root is a (harmless) warning.
      - claude plugin validate .

  eval:
    desc: "Skill evals (claude plugin eval, offline cases, uses API credits): task eval -- [--runs 1] [--case <glob>]"
    cmds:
      - claude plugin eval . --tag offline --scaffold --trust-plugin --no-publish -j 4 {{.CLI_ARGS}}

  eval:judge:
    desc: "Judge mode: every offline eval case on opus, sonnet and haiku, graded by one fixed judge (uses API credits): task eval:judge [JUDGE_MODEL=opus] -- [--case <glob>]"
    vars:
      MODELS: opus sonnet haiku
      JUDGE_MODEL: '{{.JUDGE_MODEL | default "sonnet"}}'
      OUT: evals/results/judge
    cmds:
      - rm -rf {{.OUT}} && mkdir -p {{.OUT}}
      - for: { var: MODELS }
        cmd: >-
          claude plugin eval . --tag offline --scaffold --trust-plugin --no-publish -j 4
          --runs 1 --ablation none --model {{.ITEM}} --judge-model {{.JUDGE_MODEL}}
          --json {{.OUT}}/{{.ITEM}}.json --output-dir {{.OUT}}/{{.ITEM}} {{.CLI_ARGS}}
          || echo "eval:judge: {{.ITEM}} run reported failures"
      - uv run python scripts/eval_judge_report.py {{.OUT}}
